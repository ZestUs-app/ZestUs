<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZestUs 4.0</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <img src="assets/images/zestus_logo.png" class="logo" alt="ZestUs Logo">
        <button id="zestProfileBtn">Zest Profile</button>
        <div id="visitor-info">Loading visitor info...</div>
    </header>

    <main>
        <section class="features">
            <div class="card fun">Zeeeest Fuuunnn</div>
            <div class="card chat">ZestChat</div>
            <div class="card me">ZestMe</div>
            <div class="card care">ZestCare</div>
            <div class="card projects">ZestProjects</div>
        </section>
    </main>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h2>Create Your Zest Profile</h2>
            <label>Category:</label>
            <select id="category">
                <option>Teen</option>
                <option>Student</option>
                <option>Teacher</option>
                <option>Company</option>
                <option>School</option>
                <option>University</option>
                <option>Institution</option>
                <option>Expert in Field</option>
                <option>Scientist</option>
                <option>Artist</option>
                <option>Change Maker</option>
                <option>Parent</option>
                <option>Other</option>
            </select>
            <label>Choose Avatar:</label>
            <div id="avatarSelection">
                <img src="assets/avatars/avatar_1.png" class="avatar">
                <img src="assets/avatars/avatar_2.png" class="avatar">
                <img src="assets/avatars/avatar_3.png" class="avatar">
                <img src="assets/avatars/avatar_4.png" class="avatar">
                <img src="assets/avatars/avatar_5.png" class="avatar">
                <img src="assets/avatars/avatar_6.png" class="avatar">
                <img src="assets/avatars/avatar_7.png" class="avatar">
                <img src="assets/avatars/avatar_8.png" class="avatar">
                <img src="assets/avatars/avatar_9.png" class="avatar">
            </div>
            <label>Tell us about yourself (optional):</label>
            <textarea id="about"></textarea>
            <button id="submitProfile">Submit Profile</button>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
